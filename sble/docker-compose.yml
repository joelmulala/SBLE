# SBLE production-style stack (local demo or single-node deploy)
# Usage: cp .env.example .env && docker compose up --build

name: sble

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sble}
      POSTGRES_USER: ${DB_USER:-sble}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./server/db/demo-seed.sql:/docker-entrypoint-initdb.d/03-demo-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sble

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      PERFORMANCE_SERVICE_URL: ${PERFORMANCE_SERVICE_URL:-http://performance:8000/analyze-performance}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '5000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - sble

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sble

  performance:
    profiles:
      - analytics
    build:
      context: ./performance_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8000'
    networks:
      - sble

volumes:
  postgres_data:
  uploads_data:

networks:
  sble:
    driver: bridge
